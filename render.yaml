# One-click deploy of the care platform on Render (https://render.com/deploy).
# Needs a paid instance for the persistent disk that holds the database.
services:
  - type: web
    name: steadyline-care
    runtime: docker
    rootDir: platform
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: TRUST_PROXY
        value: '1'
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: NOTIFY_CHANNEL
        value: sms
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
